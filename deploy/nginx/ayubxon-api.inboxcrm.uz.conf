# Backend (API + Instagram webhook + Socket.IO) — ayubxon-api.inboxcrm.uz
# Certbot shu faylni HTTPS uchun avtomatik tahrirlaydi (certbot --nginx buyrug'idan keyin).

server {
    listen 80;
    listen [::]:80;
    server_name ayubxon-api.inboxcrm.uz;

    # Rasm/video yuklash uchun (default 1m juda kichik)
    client_max_body_size 20m;

    # Socket.IO uchun websocket upgrade — ADMIN panelda real-vaqt xabarlar shu orqali keladi
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
